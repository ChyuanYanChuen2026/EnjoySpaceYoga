name: 後端測試建置與手動部署

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '測試與建置成功後部署正式後台（預設不部署）'
        type: boolean
        required: true
        default: false
      confirm_target:
        description: '部署時請填入 app-enjoyspace-prod'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: 隔離測試與正式建置
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 檢查手動部署條件
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        shell: pwsh
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw '正式部署僅允許 main 分支' }
          if ($env:CONFIRM_TARGET -ne 'app-enjoyspace-prod') { throw '請確認部署目標' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: 啟動 CI 專用 LocalDB
        shell: pwsh
        run: |
          $localDbTool = Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if (-not $localDbTool) {
            $localDbPath = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          } else { $localDbPath = $localDbTool.Source }
          if (-not $localDbPath) { throw '執行器未提供 SQL Server LocalDB，無法執行隔離資料庫測試' }
          & $localDbPath create EnjoySpaceCi -s
          if ($LASTEXITCODE -ne 0) { throw '無法建立 CI 專用 LocalDB' }
          'ENJOYSPACE_TEST_SERVER=(localdb)\EnjoySpaceCi' >> $env:GITHUB_ENV
          "LOCALDB_TOOL=$localDbPath" >> $env:GITHUB_ENV
      - name: 隔離服務與 HTTP 測試
        run: dotnet run --project Tests/StudentWorkflowChecks --configuration Rules -- --http
      - name: 正式建置
        run: dotnet build EnjoySpace.Web.csproj --configuration Release
      - name: 產生發布檔（不部署、不更新資料庫）
        run: dotnet publish EnjoySpace.Web.csproj --configuration Release --no-build --output artifacts/publish
      - name: 檢查發布範圍
        shell: pwsh
        run: |
          foreach ($excludedPath in @('appsettings.Development.json', 'Tests', 'Tools', 'artifacts')) {
            if (Test-Path (Join-Path artifacts/publish $excludedPath)) { throw "發布檔不應包含 $excludedPath" }
          }
      - name: 保存本次發布產物
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-${{ github.sha }}
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 7
      - name: 清理 CI 專用 LocalDB
        if: always() && env.LOCALDB_TOOL != ''
        shell: pwsh
        run: |
          & $env:LOCALDB_TOOL stop EnjoySpaceCi -k
          if ($LASTEXITCODE -ne 0) { throw '無法停止 CI 專用 LocalDB' }
          & $env:LOCALDB_TOOL delete EnjoySpaceCi
          if ($LASTEXITCODE -ne 0) { throw '無法清理 CI 專用 LocalDB' }

  deploy:
    name: 手動部署 Azure
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true && inputs.confirm_target == 'app-enjoyspace-prod'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: azure-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-release-${{ github.sha }}
          path: release-package
      - name: 登入 Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6CD69C3EDF5C4CAB8D15FF5C3F02148D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_75E2BC667E5645E9A1CCA3CBDD47A892 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4218B99CE112421D921D0C296B697884 }}
      - name: 部署本次已驗證的發布產物
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-enjoyspace-prod
          slot-name: Production
          package: release-package
